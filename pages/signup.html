<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Majestic Measure</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23d4a373'>▲</text></svg>">
</head>
<body class="auth-page">
    


    <div class="auth-actions">
        <button class="rtl-toggle auth-rtl-toggle">LTR</button>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="auth-container">
        <form action="#" id="signup-form">
            <a href="../index.html" class="auth-card-logo">
                <div class="auth-logo-icon">▲</div>
                <div class="auth-logo-text">MAJESTIC<span>MEASURE</span></div>
            </a>
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#" class="social" aria-label="Sign up with Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social" aria-label="Sign up with Google"><i class="fab fa-google"></i></a>
                <a href="#" class="social" aria-label="Sign up with Apple"><i class="fab fa-apple"></i></a>
            </div>
            <span>or use your email for registration</span>
            <div class="input-group">
                <input type="text" id="fullname" placeholder="Full Name" required />
                <input type="email" id="email" placeholder="Email" required />
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Password" required />
                    <i class="fa-regular fa-eye password-toggle"></i>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required />
                    <i class="fa-regular fa-eye password-toggle"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
