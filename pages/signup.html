<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Majestic Measure</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
</head>
<body class="auth-page">
    


    <div class="auth-actions">
        <button class="rtl-toggle auth-rtl-toggle">LTR</button>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="auth-container">
        <form action="#" id="signup-form">
            <a href="../index.html" class="auth-card-logo">
                <div class="auth-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
                        <rect width="100" height="100" rx="20" fill="#141414" stroke="#d4a373" stroke-width="2.5" />
                        <g fill="#d4a373">
                            <polygon points="50,18 56,25 50,32 44,25" />
                            <polygon points="44,25 24,18 24,32" />
                            <polygon points="56,25 76,18 76,32" />
                        </g>
                        <line x1="50" y1="36" x2="50" y2="84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
                        <path fill="#ffffff" d="M 40,18 L 8,34 C 13,40 18,44 20,45 L 35,49 C 37,39 39,29 40,18 Z" />
                        <path fill="#ffffff" d="M 10,46 L 36,50 C 42,65 47,80 50,92 C 34,78 18,60 10,46 Z" />
                        <path fill="#ffffff" d="M 60,18 L 92,34 C 87,40 82,44 80,45 L 65,49 C 63,39 61,29 60,18 Z" />
                        <path fill="#ffffff" d="M 90,46 L 64,50 C 58,65 53,80 50,92 C 66,78 82,60 90,46 Z" />
                    </svg>
                </div>
                <div class="auth-logo-text">MAJESTIC<span>MEASURE</span></div>
            </a>
            <h1>Create <span class="accent">Account</span></h1>
            <div class="social-container">
                <a href="#" class="social" aria-label="Sign up with Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social" aria-label="Sign up with Google"><i class="fab fa-google"></i></a>
                <a href="#" class="social" aria-label="Sign up with Apple"><i class="fab fa-apple"></i></a>
            </div>
            <span>or use your email for registration</span>
            <div class="input-group">
                <input type="text" id="fullname" placeholder="Full Name" required />
                <input type="email" id="email" placeholder="Email" required />
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Password" required />
                    <i class="fa-regular fa-eye password-toggle"></i>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required />
                    <i class="fa-regular fa-eye password-toggle"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
