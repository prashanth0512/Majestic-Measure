<template id="tpl-overview">
<div class="section">
    <div class="section-title">
        <h1>Dashboard <span class="gold">Overview</span></h1>
        <p>Welcome back! Here's your tailoring journey at a glance.</p>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fa-solid fa-box"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Total Orders</span>
                <span class="kpi-value">12</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon green"><i class="fa-solid fa-spinner"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Active Orders</span>
                <span class="kpi-value">3</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon amber"><i class="fa-solid fa-ruler-combined"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Pending Measurements</span>
                <span class="kpi-value">1</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon blue"><i class="fa-solid fa-calendar"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Upcoming Appointments</span>
                <span class="kpi-value">2</span>
            </div>
        </div>
    </div>

    <div class="featured-stat card" style="margin-bottom: 28px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Ongoing Project Progress</h3>
            <span class="badge in-progress">Bespoke Navy Tuxedo</span>
        </div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" style="width: 72%"></div>
            <span class="progress-pct">72%</span>
        </div>
        <div style="display: flex; gap: 40px; margin-top: 15px;">
            <div class="mini-stat"><strong>Apr 12</strong><span>EST. COMPLETION</span></div>
            <div class="mini-stat"><strong>Stitching</strong><span>CURRENT STAGE</span></div>
            <div class="mini-stat"><strong>2</strong><span>FITTINGS REMAINING</span></div>
        </div>
    </div>

    <div class="overview-bottom">
        <div class="chart-box card">
            <div class="card-head">
                <h3>Order Analytics</h3>
            </div>
            <div class="charts-container">
                <div class="chart-wrap">
                    <canvas id="ordersChart"></canvas>
                </div>
                <div class="chart-wrap pie-chart-wrap">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="activity-box">
            <div class="card activity-card">
                <h3 class="card-head-inline">Recent Activity</h3>
                <div class="act-item">
                    <span class="act-dot gold-dot"></span>
                    <div>
                        <p><strong>Stitching started</strong> on Navy Bespoke Suit</p>
                        <small>2 hours ago</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Fabric approved</strong> — Loro Piana Cashmere</p>
                        <small>Yesterday</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Appointment confirmed</strong> for Mar 28</p>
                        <small>2 days ago</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Order #MM-2025-089</strong> marked as delivered.</p>
                        <small>Dec 20, 2025</small>
                    </div>
                </div>
            </div>

            <div class="card next-apt-card">
                <h3 class="card-head-inline">Next Appointment</h3>
                <div class="apt-mini">
                    <div class="apt-mini-date">
                        <span>MAR</span>
                        <strong>28</strong>
                    </div>
                    <div>
                        <p><strong>First Fitting</strong></p>
                        <small><i class="fa-solid fa-clock"></i> 11:00 AM – 12:00 PM</small>
                        <span class="badge confirmed">Confirmed</span>
                    </div>
                </div>
            </div>

            <div class="card loyalty-card">
                <h3 class="card-head-inline">Loyalty Status</h3>
                <div class="loyalty-wrap">
                    <div class="tier-info">
                        <span class="tier gold-tier">Gold Member</span>
                        <p class="points"><strong>4,250</strong> / 5,000 pts to Platinum</p>
                    </div>
                    <div class="progress-bar-wrap mini">
                        <div class="progress-bar-fill" style="width: 85%"></div>
                    </div>
                    <p class="loyalty-benefit">750 more points to unlock **Complimentary Shirt**!</p>
                </div>
            </div>
        </div>
    </div>
</div>

<template id="tpl-measurements">
<div class="section">
    <div class="section-title">
        <h1>My <span class="gold">Measurements</span></h1>
        <button class="btn-gold" id="saveMeasurementsBtn">Save Changes</button>
    </div>
    <div class="meas-layout">
        <div class="card meas-form-card">
            <h3 class="card-head-inline">Body Measurements (cm)</h3>
            <div class="meas-grid">
                <div class="meas-field"><label>Chest</label><input type="number" value="102" step="0.5"></div>
                <div class="meas-field"><label>Waist</label><input type="number" value="88" step="0.5"></div>
                <div class="meas-field"><label>Hip</label><input type="number" value="98" step="0.5"></div>
                <div class="meas-field"><label>Shoulder Width</label><input type="number" value="48" step="0.5"></div>
                <div class="meas-field"><label>Sleeve Length</label><input type="number" value="64" step="0.5"></div>
                <div class="meas-field"><label>Neck</label><input type="number" value="41" step="0.5"></div>
                <div class="meas-field"><label>Inseam</label><input type="number" value="80" step="0.5"></div>
                <div class="meas-field"><label>Back Length</label><input type="number" value="70" step="0.5"></div>
            </div>
            <p class="meas-note"><i class="fa-solid fa-info-circle"></i> Last updated: March 15, 2026</p>
        </div>
        <div class="card meas-guide-card">
            <h3 class="card-head-inline">Measurement Guide</h3>
            <img src="../images/measurement-guide.png" alt="Guide" class="guide-img">
            <p class="meas-note" style="margin-top:15px;"><i class="fa-solid fa-circle-check"></i> Use a soft measuring tape. Keep it snug, not tight.</p>
        </div>
    </div>
</div>
</template>

<template id="tpl-progress">

                </div>
                <span class="contact-time">2h</span>
            </div>
            <div class="contact-item">

                <div class="contact-info">
                    <strong>William Cross</strong>
                    <small>Fitting confirmed for Mar 28</small>
                </div>
                <span class="contact-time">1d</span>

            <div class="messages-list">

                    <div class="msg-bubble">Good afternoon, Mr. Ashworth. Your Navy suit is progressing beautifully.</div>
                    <span class="msg-time">10:30 AM</span>
                </div>
                <div class="msg-row me">
                    <div class="msg-bubble">Wonderful! When can I come for the first fitting?</div>
                    <span class="msg-time">10:32 AM</span>
                </div>
                <div class="msg-row them">
                    <div class="msg-bubble">We have availability on March 28 at 11 AM. Shall I confirm that?</div>
                    <span class="msg-time">10:35 AM</span>
                </div>
                <div class="msg-row me">
                    <div class="msg-bubble">Perfect, please confirm!</div>
                    <span class="msg-time">10:36 AM</span>
                </div>
            </div>
            <div class="chat-input-row">
                <input type="text" placeholder="Type your message…" class="chat-input">
                <button class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>
</template>

<template id="tpl-notifications">
<div class="section">
    <div class="section-title">
        <h1>Your <span class="gold">Notifications</span></h1>
    </div>
    <div class="card notif-card">
        <div class="notif-item unread">
            <div class="notif-ico gold-ico"><i class="fa-solid fa-scissors"></i></div>
            <div class="notif-body">
                <p>Your bespoke Navy Suit has moved to the <strong>Stitching</strong> phase.</p>
                <small>Today, 10:45 AM</small>
            </div>
        </div>
        <div class="notif-item unread">
            <div class="notif-ico gold-ico"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="notif-body">
                <p>Appointment confirmed for <strong>First Fitting</strong> on March 28, 2026.</p>
                <small>Yesterday, 3:12 PM</small>
            </div>
        </div>
        <div class="notif-item">
            <div class="notif-ico"><i class="fa-solid fa-swatchbook"></i></div>
            <div class="notif-body">
                <p>Loro Piana fabric has been <strong>approved</strong> for your order.</p>
                <small>March 24, 2026</small>
            </div>
        </div>
        <div class="notif-item">
            <div class="notif-ico"><i class="fa-solid fa-circle-check"></i></div>
            <div class="notif-body">
                <p>Payment received for <strong>Order #MM-2026-001</strong>.</p>
                <small>February 10, 2026</small>
            </div>
        </div>
    </div>
</div>
</template>
<template id="tpl-profile">
<div class="section">
    <div class="section-title">
        <h1>My <span class="gold">Profile</span></h1>
        <button class="btn-gold">Edit Profile</button>
    </div>
    <div class="profile-layout">
        <div class="card profile-main-card">
            <div class="profile-avatar-section">
                <img src="https://ui-avatars.com/api/?name=Yash&background=C8A96A&color=111&size=200" alt="Profile" class="profile-avatar-lg">
                <div class="profile-id">
                    <h2>Yash</h2>
                    <span class="loyalty-badge"><i class="fa-solid fa-star"></i> Gold Member</span>
                </div>
            </div>
            <div class="profile-details">
                <div class="profile-field"><i class="fa-solid fa-envelope"></i><span>[EMAIL_ADDRESS]</span></div>
                <div class="profile-field"><i class="fa-solid fa-phone"></i><span>+91 98765 43210</span></div>
                <div class="profile-field"><i class="fa-solid fa-location-dot"></i><span>Hyderabad, Telangana</span></div>
                <div class="profile-field"><i class="fa-solid fa-calendar"></i><span>Client since 2024</span></div>
            </div>
        </div>
        <div class="profile-side">
            <div class="card stats-card">
                <h3 class="card-head-inline">Account Summary</h3>
                <div class="account-stats">
                    <div class="a-stat"><strong>12</strong><span>Total Orders</span></div>
                    <div class="a-stat"><strong>$4,500</strong><span>Total Spent</span></div>
                    <div class="a-stat"><strong>Gold</strong><span>Tier Status</span></div>
                </div>
            </div>
        </div>
    </div>
</div>
</template>
