<template id="tpl-overview">
<div class="section">
    <div class="section-title">
        <div>
            <h1>Atelier Patron <span class="gold">Overview</span></h1>
            <p>Welcome back, Yash! Here is your bespoke commissions summary and active fittings.</p>
        </div>
        <div class="overview-actions">
            <button class="btn-gold" onclick="document.querySelector('[data-section=\'appointments\']').click()"><i class="fa-solid fa-calendar-plus"></i> Book Fitting</button>
        </div>
    </div>

    <!-- 4 KPI Stat Cards -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fa-solid fa-user-tie"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Active Commissions</span>
                <span class="kpi-value">02 <small style="font-size:12px; opacity: 0.7;">Suits</small></span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon green"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Next Fitting</span>
                <span class="kpi-value">Mar 28</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon amber"><i class="fa-solid fa-swatchbook"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Saved Fabrics</span>
                <span class="kpi-value">06 <small style="font-size:12px; opacity: 0.7;">Mills</small></span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon blue"><i class="fa-solid fa-award"></i></div>
            <div class="kpi-info">
                <span class="kpi-label">Atelier Points</span>
                <span class="kpi-value">4,250 <small style="font-size:12px; color:var(--gold);">Gold</small></span>
            </div>
        </div>
    </div>

    <!-- Active Commission Progress Pipeline -->
    <div class="featured-stat card" style="margin-bottom: 28px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div>
                <span class="badge in-progress" style="margin-bottom: 6px; display: inline-block;">IN CRAFTSMANSHIP</span>
                <h3 style="font-size: 20px;">Bespoke Midnight Navy Tuxedo <span class="gold">#MM-2026-091</span></h3>
            </div>
            <div style="text-align: right;">
                <span class="gold-tier" style="font-weight: 700; font-size: 14px;">Est. Delivery: April 12, 2026</span>
            </div>
        </div>
        
        <!-- 4 Stage Pipeline Steps -->
        <div class="pipeline-steps">
            <div class="pipeline-step completed">
                <div class="step-icon"><i class="fa-solid fa-check"></i></div>
                <span>1. Measurements</span>
                <small>Completed Mar 10</small>
            </div>
            <div class="pipeline-step completed">
                <div class="step-icon"><i class="fa-solid fa-check"></i></div>
                <span>2. Paper Pattern</span>
                <small>Completed Mar 18</small>
            </div>
            <div class="pipeline-step active">
                <div class="step-icon"><i class="fa-solid fa-scissors"></i></div>
                <span>3. Hand Stitching</span>
                <small>In Progress (72%)</small>
            </div>
            <div class="pipeline-step">
                <div class="step-icon"><i class="fa-solid fa-shirt"></i></div>
                <span>4. Final Fitting</span>
                <small>Scheduled Apr 05</small>
            </div>
        </div>

        <div class="progress-bar-wrap" style="margin-top: 24px;">
            <div class="progress-bar-fill" style="width: 72%"></div>
            <span class="progress-pct">72% Completed</span>
        </div>
    </div>

    <!-- Saved Cloth Favorites Swatches -->
    <div class="card" style="margin-bottom: 28px;">
        <div class="card-head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Saved Cloth Archive <span class="gold">Swatches</span></h3>
            <a href="#" onclick="document.querySelector('[data-section=\'fabrics\']').click()" style="color: var(--gold); font-size: 13px; text-decoration: none; font-weight: 600;">View All Swatches →</a>
        </div>
        <div class="fabric-swatches-grid">
            <div class="swatch-card">
                <div class="swatch-img" style="background-image: url('../images/fabric-1.png');"></div>
                <div class="swatch-details">
                    <span class="swatch-mill">LORO PIANA • BIELLA</span>
                    <h4>Super 170s Royal Wool</h4>
                    <p>Navy Pinstripe • 260g/m</p>
                </div>
            </div>
            <div class="swatch-card">
                <div class="swatch-img" style="background-image: url('../images/fabric-2.png');"></div>
                <div class="swatch-details">
                    <span class="swatch-mill">HOLLAND & SHERRY</span>
                    <h4>SherryTweed Herringbone</h4>
                    <p>Charcoal Tweed • 340g/m</p>
                </div>
            </div>
            <div class="swatch-card">
                <div class="swatch-img" style="background-image: url('../images/fabric-3.png');"></div>
                <div class="swatch-details">
                    <span class="swatch-mill">VITALE BARBERIS</span>
                    <h4>Flannel Wool Canvas</h4>
                    <p>Midnight Blue • 300g/m</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SEPARATE DEDICATED SECTION 1: Monthly Tailoring Spendings Bar Chart -->
    <div class="card monthly-spendings-card" style="margin-bottom: 28px;">
        <div class="card-head" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
            <div>
                <span class="swatch-mill" style="margin-bottom: 4px;">FINANCIAL TRACKER</span>
                <h3 style="font-size: 22px;">Monthly Tailoring Spendings & <span class="gold">Investments</span></h3>
            </div>
            <div class="spend-stats-pills" style="display: flex; gap: 12px; flex-wrap: wrap;">
                <div style="background: rgba(212, 163, 115, 0.08); border: 1px solid var(--border); padding: 8px 16px; border-radius: 14px; text-align: right;">
                    <span style="font-size: 9.5px; letter-spacing: 1px; color: var(--gray); display: block; font-weight: 700;">TOTAL INVESTED</span>
                    <strong style="font-size: 16px; color: var(--gold); font-family: 'Playfair Display', serif;">$14,850</strong>
                </div>
                <div style="background: rgba(212, 163, 115, 0.08); border: 1px solid var(--border); padding: 8px 16px; border-radius: 14px; text-align: right;">
                    <span style="font-size: 9.5px; letter-spacing: 1px; color: var(--gray); display: block; font-weight: 700;">AVG PER COMMISSION</span>
                    <strong style="font-size: 16px; color: var(--black); font-family: 'Playfair Display', serif;">$3,710</strong>
                </div>
            </div>
        </div>
        <div class="big-chart-container" style="height: 320px; position: relative; width: 100%;">
            <canvas id="ordersChart"></canvas>
        </div>
    </div>

    <!-- SEPARATE DEDICATED SECTION 2: Category Allocation Doughnut Chart -->
    <div class="card category-allocation-card" style="margin-bottom: 28px;">
        <div class="card-head" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
            <div>
                <span class="swatch-mill" style="margin-bottom: 4px;">CATEGORY BREAKDOWN</span>
                <h3 style="font-size: 22px;">Sartorial Portfolio & <span class="gold">Garment Allocation</span></h3>
            </div>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <span class="badge in-progress">65% Bespoke Suits</span>
                <span class="badge confirmed">20% Ceremonial</span>
                <span class="badge amber">10% Custom Shirts</span>
            </div>
        </div>
        <div class="big-pie-container" style="height: 300px; position: relative; width: 100%; display: flex; justify-content: center; align-items: center;">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <!-- Overview Grid Layout: Recent Commissions + Activity & Concierge -->
    <div class="overview-bottom">
        <div class="chart-box card">
            <div class="card-head">
                <h3>Recent Commissions & <span class="gold">Invoices</span></h3>
            </div>
            <!-- Recent Orders Table -->
            <div style="margin-top: 10px;">
                <table class="orders-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--gray);">
                            <th style="padding: 10px 0;">ORDER ID</th>
                            <th>SERVICE</th>
                            <th>TAILOR</th>
                            <th>STATUS</th>
                            <th style="text-align: right;">ACTION</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid var(--border); font-size: 13.5px;">
                            <td style="padding: 14px 0; font-weight: 600;">#MM-2026-091</td>
                            <td>Bespoke Tuxedo</td>
                            <td>Master Charles</td>
                            <td><span class="badge in-progress">In Craft</span></td>
                            <td style="text-align: right;"><a href="#" style="color: var(--gold); text-decoration: none;">Track</a></td>
                        </tr>
                        <tr style="border-bottom: 1px solid var(--border); font-size: 13.5px;">
                            <td style="padding: 14px 0; font-weight: 600;">#MM-2026-044</td>
                            <td>Custom Linen Shirts (3x)</td>
                            <td>Tailor David</td>
                            <td><span class="badge confirmed">Delivered</span></td>
                            <td style="text-align: right;"><a href="#" style="color: var(--gold); text-decoration: none;">Invoice</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="activity-box">
            <div class="card activity-card">
                <h3 class="card-head-inline">Recent <span class="gold">Activity</span></h3>
                <div class="act-item">
                    <span class="act-dot gold-dot"></span>
                    <div>
                        <p><strong>Stitching started</strong> on Navy Bespoke Suit</p>
                        <small>2 hours ago</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Fabric approved</strong> — Loro Piana Cashmere</p>
                        <small>Yesterday</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Appointment confirmed</strong> for Mar 28</p>
                        <small>2 days ago</small>
                    </div>
                </div>
                <div class="act-item">
                    <span class="act-dot"></span>
                    <div>
                        <p><strong>Order #MM-2025-089</strong> marked as delivered.</p>
                        <small>Dec 20, 2025</small>
                    </div>
                </div>
            </div>

            <!-- Concierge Contact Card -->
            <div class="card" style="padding: 20px; background: linear-gradient(135deg, rgba(212,163,115,0.08), rgba(20,16,15,0.04)); border: 1px solid var(--border);">
                <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
                    <img src="../images/about_team_sophia.png" alt="Concierge" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold);">
                    <div>
                        <h4 style="font-family: 'Playfair Display', serif; font-size: 16px; margin: 0;">Master Tailor Concierge</h4>
                        <span style="font-size: 12px; color: var(--gray);">Sophia Sterling • Direct Contact</span>
                    </div>
                </div>
                <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px;">Have questions about your fitting or fabric customizations? Your personal concierge is available.</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-gold" onclick="document.querySelector('[data-section=\'messages\']').click()" style="flex: 1; padding: 8px 12px; font-size: 12px;"><i class="fa-solid fa-message"></i> Direct Chat</button>
                </div>
            </div>

            <div class="card loyalty-card">
                <h3 class="card-head-inline">Loyalty <span class="gold">Status</span></h3>
                <div class="loyalty-wrap">
                    <div class="tier-info">
                        <span class="tier gold-tier">Gold VIP Member</span>
                        <p class="points"><strong>4,250</strong> / 5,000 pts</p>
                    </div>
                    <div class="progress-bar-wrap mini">
                        <div class="progress-bar-fill" style="width: 85%"></div>
                    </div>
                    <p class="loyalty-benefit" style="font-size: 12px; color: var(--gray); margin-top: 6px;">750 more points to unlock <strong>Complimentary Shirt Commission</strong>!</p>
                </div>
            </div>
        </div>
    </div>
</div>
</template>

<template id="tpl-measurements">
<div class="section">
    <div class="section-title">
        <h1>My <span class="gold">Measurements</span></h1>
        <button class="btn-gold" id="saveMeasurementsBtn">Save Changes</button>

    <div class="meas-layout">
        <div class="card meas-form-card">

            <div class="meas-grid">
                <div class="meas-field"><label>Chest</label><input type="number" value="102" step="0.5"></div>

    <div class="fabric-grid">
        <div class="fabric-card card">
            <div class="fabric-img-wrap"><img src="../images/fabric-1.png" alt="Navy Wool" onerror="this.src='https://placehold.co/280x200/111/C8A96A?text=Navy+Wool'"></div>
