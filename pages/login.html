<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Majestic Measure</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/fixes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23d4a373'>▲</text></svg>">
</head>
<body class="auth-page">
    <a href="../index.html" class="back-to-site">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Website</span>
    </a>
    
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-container">
        <form action="#" id="login-form">
            <h1>Login</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your account</span>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required />
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Password" required />
                    <i class="fa-regular fa-eye password-toggle"></i>
                </div>
            </div>
            <div class="form-footer">
                <label class="remember-me">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#">Forgot your password?</a>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
            <p class="auth-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
