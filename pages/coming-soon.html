<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Majestic Measure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-primary);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            position: relative;
            transition: background-color 0.5s ease;
        }

        .coming-soon-container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            max-width: 900px;
            animation: fadeIn 1.5s ease-out;
            width: 100%;
        }

        span.subtitle {
            font-size: 14px;
            letter-spacing: 8px;
            color: var(--primary-color);
            display: block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            margin-bottom: 20px;
            font-weight: 300;
            line-height: 1.1;
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 70px;
            flex-wrap: wrap;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .countdown-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            font-weight: 400;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 5px;
            position: relative;
        }

        .countdown-number::after {
            content: ':';
            position: absolute;
            right: -25px;
            bottom: 5px;
            opacity: 0.3;
        }

        .countdown-item:last-child .countdown-number::after {
            display: none;
        }

        .countdown-label {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            opacity: 0.6;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 16px 40px;
            background-color: var(--primary-color);
            color: var(--bg-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 2px;
            transition: var(--transition-smooth);
            border: 1px solid var(--primary-color);
        }

        .back-home:hover {
            background-color: transparent;
            color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(200, 169, 106, 0.1);
        }

        .theme-float {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            font-size: 20px;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-premium);
        }

        .theme-float:hover {
            transform: rotate(30deg) scale(1.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .cloth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(45deg, rgba(200,169,106,0.02) 0%, transparent 100%);
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h2 { font-size: 42px; }
            .countdown { gap: 20px; }
            .countdown-number { font-size: 40px; }
            .countdown-number::after { display: none; }
            .theme-float { top: 20px; right: 20px; width: 40px; height: 40px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <button class="theme-float" id="theme-toggle" title="Toggle Theme">
        <i class="fa-regular fa-sun"></i>
    </button>
    
    <div class="cloth-overlay"></div>

    <div class="coming-soon-container">
        <span class="subtitle">EST. 2015</span>
        <h2>Something Extraordinary<br><span class="italic">is in the Making</span></h2>
        <p>Our artisans are currently crafting a new digital experience that matches the precision of our finest bespoke garments. Join us shortly.</p>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Mins</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Secs</div>
            </div>
        </div>

        <a href="../index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> RETURN TO ATELIER
        </a>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const icon = themeBtn.querySelector('i');
        
        const applyTheme = (theme) => {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                icon.className = 'fa-regular fa-moon';
            } else {
                document.body.classList.remove('light-mode');
                icon.className = 'fa-regular fa-sun';
            }
            localStorage.setItem('maison_theme', theme);
        };

        const savedTheme = localStorage.getItem('maison_theme') || 'dark';
        applyTheme(savedTheme);

        themeBtn.addEventListener('click', () => {
            const isLight = document.body.classList.contains('light-mode');
            applyTheme(isLight ? 'dark' : 'light');
        });
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date().getTime();
            const timeRemaining = targetDate.getTime() - now;

            if (timeRemaining > 0) {
                const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days < 10 ? '0' + days : days;
                document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
            } else {
                document.getElementById('countdown').innerHTML = "<h3>Our newest collection has arrived.</h3>";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
